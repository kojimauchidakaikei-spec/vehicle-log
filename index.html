<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4f46">
<title>車両管理アプリ</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#17312c;--muted:#6c7c78;--line:#d9e2df;--main:#1f6f5f;--main2:#174f45;--danger:#b33a3a;--soft:#e7f3ef;--orange:#f5b97a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:rgba(243,246,245,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 14px 10px}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:20px;font-weight:800}.version{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:4px 7px;border-radius:999px}main{max-width:760px;margin:auto;padding:14px 14px 100px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 16px rgba(25,55,48,.05);margin-bottom:12px}.profilebar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.profilebar select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font-weight:800;color:var(--ink)}.monthbar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}.monthbar button{height:40px;border:none;border-radius:12px;background:var(--soft);color:var(--main2);font-size:20px}.monthtitle{text-align:center;font-size:18px;font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:var(--soft);border-radius:12px;padding:10px 8px;text-align:center}.metric b{display:block;font-size:20px;margin-top:3px}.metric span{font-size:11px;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.primary,.secondary,.danger{border:none;border-radius:12px;padding:12px;font-weight:800}.primary{background:var(--main);color:white}.secondary{background:#fff;color:var(--main2);border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--danger);border:1px solid #f0caca}.daylist{display:flex;flex-direction:column;gap:8px}.day{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px}.datebox{text-align:center}.datebox b{display:block;font-size:17px}.datebox span{font-size:12px;color:var(--muted)}.daymain{min-width:0}.route{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.km{font-weight:800;color:var(--main2)}.off{opacity:.65}.today{outline:2px solid #74a99d}.direct{display:inline-block;font-size:10px;background:#fff1d7;color:#8d5c00;padding:2px 5px;border-radius:999px;margin-left:4px}.fab{position:fixed;right:18px;bottom:20px;z-index:30;width:60px;height:60px;border-radius:50%;border:none;background:var(--main);color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(22,85,72,.35)}dialog{border:none;border-radius:18px;width:min(94vw,580px);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.35)}.modalhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}.modalbody{padding:14px 16px 18px;max-height:78vh;overflow:auto}.close{border:none;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:20px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:72px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkline{display:flex;align-items:center;gap:8px;margin:8px 0 14px}.hint{font-size:11px;color:var(--muted)}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;text-align:left}.chip.selected{background:var(--soft);border-color:#8eb9ae;color:var(--main2);font-weight:700}.chip small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.distancebox{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.distancebox select,.distancebox input{font-size:18px;font-weight:800;text-align:center;background:var(--soft)}.distancebox .mini-label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;text-align:center}.companyrow{display:grid;grid-template-columns:1fr 90px 42px;gap:7px;margin-bottom:7px}.companyrow button{border:none;border-radius:10px;background:#fff0f0;color:var(--danger);font-weight:800}.sectiontitle{font-weight:800;margin:18px 0 9px}.employee-list{display:flex;flex-direction:column;gap:8px}.employee-card{display:grid;grid-template-columns:1fr auto;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px}.employee-card small{display:block;color:var(--muted);margin-top:3px}.output-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}#printArea{display:none}@media(max-width:480px){.actions{grid-template-columns:1fr 1fr}.actions button:first-child{grid-column:1/-1}.settings-grid,.twocol{grid-template-columns:1fr}.companyrow{grid-template-columns:1fr 78px 42px}}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;color:#000;background:#fff}.report{width:190mm;margin:0 auto;font-family:"Yu Gothic",sans-serif;font-size:9.5pt}.rtitle{text-align:center;font-weight:800;font-size:15pt;margin:7mm 0 2mm}.rname{margin-bottom:3mm}.report table{width:100%;border-collapse:collapse;table-layout:fixed}.report th,.report td{border:1px solid #000;padding:1.2mm 1mm;height:7mm}.report th{text-align:center}.c1{width:8mm}.c2{width:9mm}.c3{width:9mm}.c4,.c5{width:30mm}.c6{width:28mm}.num{text-align:right}.total1{background:#c9f7c8}.total2{background:#c9f4f6}.total3{background:#ffd09e;font-weight:800}.no-border{border:none!important}.report-footer{margin-top:3mm;text-align:right}}
</style>
</head><body>
<header><div class="headrow"><div class="title">車両管理</div><div class="version">v1.3.0</div></div></header>
<main>
<section class="card profilebar"><select id="employeeSelect"></select><button class="secondary" id="employeesBtn">従業員設定</button></section>
<section class="card"><div class="monthbar"><button id="prevMonth">‹</button><div class="monthtitle" id="monthTitle"></div><button id="nextMonth">›</button></div><div class="summary"><div class="metric"><span>業務走行</span><b id="businessKm">0km</b></div><div class="metric"><span>通勤距離</span><b id="commuteKm">0km</b></div><div class="metric"><span>総走行</span><b id="totalKm">0km</b></div></div></section>
<section class="card actions"><button class="secondary" id="profileBtn">本人・会社設定</button><button class="primary" id="printBtn">印刷</button><button class="secondary" id="excelBtn">Excel出力</button></section>
<section class="daylist" id="dayList"></section>
</main><button class="fab" id="addBtn">＋</button>

<dialog id="entryDialog"><div class="modalhead"><b>記録を入力</b><button class="close" data-close="entryDialog">×</button></div><form class="modalbody" id="entryForm"><input type="hidden" id="entryDateKey"><div class="field"><label>日付</label><input type="date" id="entryDate" required></div><div class="field"><label>到着時メーター</label><div class="distancebox"><select id="startMeterWheel" aria-label="到着時メーターを選択"></select><input type="number" inputmode="numeric" id="startMeter" aria-label="到着時メーターを直接入力"></div><div class="hint" id="startHint"></div></div><div class="field"><label>行った会社を選ぶ</label><div class="chips" id="companyChips"></div><div class="hint" id="companyTotal">概算距離 0km</div></div><div class="field"><label>訪問先（自由入力・追記）</label><textarea id="destinations"></textarea></div><div class="field"><label>帰社時メーター</label><div class="distancebox"><select id="endMeterWheel" aria-label="帰社時メーターを選択"></select><input type="number" inputmode="numeric" id="endMeter" aria-label="帰社時メーターを直接入力"></div><div class="hint" id="endHint"></div></div><div class="field"><label>業務走行距離</label><input id="distanceDisplay" readonly value="0 km" style="font-size:20px;font-weight:800;text-align:center;background:var(--soft)"></div><label class="checkline"><input type="checkbox" id="directFlag"> 直行・直帰あり</label><div class="field"><label>メモ</label><textarea id="memo"></textarea></div><div class="modalactions"><button type="button" class="danger" id="deleteEntry">削除</button><button class="primary" type="submit">保存</button></div></form></dialog>

<dialog id="profileDialog"><div class="modalhead"><b>本人・会社設定</b><button class="close" data-close="profileDialog">×</button></div><form class="modalbody" id="profileForm"><div class="field"><label>氏名</label><input id="personName"></div><div class="settings-grid"><div class="field"><label>通勤片道距離（km）</label><input type="number" step="0.1" id="oneWayKm"></div><div class="field"><label>前回帰社メーターへの加算（km）</label><input type="number" step="0.1" id="arrivalAddKm"><div class="hint">小島さんなら往復10km</div></div><div class="field"><label>直行直帰加算（片道・km）</label><input type="number" step="0.1" id="directOneWayKm"></div></div><div class="sectiontitle">会社一覧と概算距離</div><div id="companyRows"></div><button type="button" class="secondary" id="addCompanyBtn" style="width:100%">＋会社を追加</button><div class="hint" style="margin-top:12px">設定と記録はこの端末内だけに保存されます。</div><div class="modalactions"><button type="button" class="secondary" id="backupBtn">バックアップ</button><button class="primary" type="submit">保存</button></div><div style="margin-top:8px"><label class="secondary" style="display:block;text-align:center;padding:12px;border-radius:12px">バックアップを復元<input type="file" id="importFile" accept="application/json" hidden></label></div></form></dialog>

<dialog id="employeesDialog"><div class="modalhead"><b>従業員設定</b><button class="close" data-close="employeesDialog">×</button></div><div class="modalbody"><div class="employee-list" id="employeeList"></div><button class="primary" id="addEmployeeBtn" style="width:100%;margin-top:12px">＋従業員を追加</button><div class="hint" style="margin-top:10px">従業員ごとに会社一覧・距離・記録が分かれます。</div></div></dialog>
<div id="printArea"></div>
<script>
const APP_VERSION='1.2.0',STORE='vehicleLogAppDataV2',OLD_STORE='vehicleLogAppDataV1';
const initialCompanies=[['パールハイム㈱',14],['㈱日本水工社',20],['㈱FBA篠塚',10],['㈲メゾンド下屋敷',10],['（同）コーポ高橋',10],['㈱招きレコーズ',42],['㈱森田',10],['㈲コンフォート',10],['㈱ASAHIYA',10],['㈱AKIKAZE',10],['㈲栄グリーンハイツ',10],['㈲ワッツプランニング',8],['㈱スティルルームス',22],['㈱一心',19],['㈱幸信',10],['㈲豊田油店',10]].map((x,i)=>({id:'c'+i,name:x[0],distance:x[1]}));
const sakaiCompanies=[['㈱竹井造園（南田中）',15],['東伸興業（西大泉）',27],['小川材木店（谷原）',18],['JS企画（三鷹市）',30],['ウェルワークス（関町北）',6],['本多ガス（貫井）',20],['伸光商事（氷川台）',25],['正久保不動産（氷川台）',25],['風祭（桜台）',25],['美綺設備（三原台）',22],['浦田（江戸川区）',165],['石手（桜台）',25],['橋本（関町北）',8],['西武信金（柳沢）',8],['横山正枝（桜台）',27],['田中晴彦（南田中・富士見台）',20],['小澤孝男（高松）',23],['加藤シゲ子（大泉学園）',13],['奥住（田無）',13],['アポロ産業（早宮）',20],['宮田茂（中野）',26],['グロース相原（北町）',12],['ライツ（北町）',12],['ベルビュー不動産（中村橋）',10],['貴和（北区）',20],['CXO研修（市ヶ谷）',34],['アミオス（小平市）',52],['中山解体（貫井・中村橋）',20],['影山工務店（関町北）',8],['プログラス（上石神井）',7]].map((x,i)=>({id:'s'+i,name:x[0],distance:x[1]}));
const sakaiEmployee=()=>({id:'e2',name:'酒井 直',oneWayKm:0.5,arrivalAddKm:1,directOneWayKm:0,companies:structuredClone(sakaiCompanies),entries:{}});
const fresh=()=>({activeEmployeeId:'e1',employees:{e1:{id:'e1',name:'小島 裕司',oneWayKm:5,arrivalAddKm:10,directOneWayKm:7.5,companies:structuredClone(initialCompanies),entries:{}},e2:sakaiEmployee()}});
let data=load(),cursor=new Date();cursor.setDate(1);let selectedCompanyIds=[];
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('ja-JP'),weekdays=['日','月','火','水','木','金','土'];
const keyOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
function load(){try{const v2=JSON.parse(localStorage.getItem(STORE)||'null');if(v2?.employees){if(!Object.values(v2.employees).some(e=>e.name.replace(/\s/g,'')==='酒井直'))v2.employees.e2=sakaiEmployee();return v2}const old=JSON.parse(localStorage.getItem(OLD_STORE)||'null');if(old?.settings){const d=fresh(),e=d.employees.e1;e.name=old.settings.personName||e.name;e.oneWayKm=Number(old.settings.oneWayKm??5);e.arrivalAddKm=e.oneWayKm*2;e.directOneWayKm=Number(old.settings.directOneWayKm??7.5);e.companies=(old.settings.clients||[]).map((name,i)=>({id:'c'+i,name,distance:0}));e.entries=old.entries||{};return d}return fresh()}catch{return fresh()}}
function save(){localStorage.setItem(STORE,JSON.stringify(data))}function emp(){return data.employees[data.activeEmployeeId]}function monthEntries(){const p=`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`;return Object.entries(emp().entries).filter(([k])=>k.startsWith(p))}
function entryDistance(e){if(e==null)return 0;if(e.distance!==undefined&&e.distance!=='')return Number(e.distance)||0;const s=Number(e.startMeter),en=Number(e.endMeter);return s&&en&&en>=s?en-s:0}
function calc(){let business=0,workdays=0,directCount=0;for(const[,e]of monthEntries()){business+=entryDistance(e);if(e.startMeter||e.endMeter||e.destinations)workdays++;if(e.directFlag)directCount++}const commute=emp().oneWayKm*2*workdays,direct=emp().directOneWayKm*directCount;return{business,workdays,directCount,commute,direct,total:business+commute+direct}}
function renderEmployeeSelect(){const s=$('#employeeSelect');s.innerHTML='';Object.values(data.employees).forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name;o.selected=e.id===data.activeEmployeeId;s.appendChild(o)})}
function render(){renderEmployeeSelect();const y=cursor.getFullYear(),m=cursor.getMonth();$('#monthTitle').textContent=`${y}年${m+1}月`;const c=calc();$('#businessKm').textContent=`${fmt(c.business)}km`;$('#commuteKm').textContent=`${fmt(c.commute)}km`;$('#totalKm').textContent=`${fmt(c.total)}km`;const list=$('#dayList');list.innerHTML='';const today=keyOf(new Date());for(let d=1;d<=daysInMonth(y,m);d++){const dt=new Date(y,m,d),k=keyOf(dt),e=emp().entries[k],distance=entryDistance(e),node=document.createElement('button');node.className='day'+(!e?' off':'')+(k===today?' today':'');node.innerHTML=`<div class="datebox"><b>${d}</b><span>${weekdays[dt.getDay()]}</span></div><div class="daymain"><div class="route">${e?.destinations||'記録なし'}${e?.directFlag?'<span class="direct">直行直帰</span>':''}</div><div class="sub">${e?.startMeter?fmt(e.startMeter)+' → '+fmt(e.endMeter||e.startMeter):'メーター未入力'}</div></div><div class="km">${fmt(distance)}km</div>`;node.onclick=()=>openEntry(k);list.appendChild(node)}}
function previousEnd(k){const keys=Object.keys(emp().entries).filter(x=>x<k).sort().reverse();for(const x of keys){if(emp().entries[x].endMeter)return Number(emp().entries[x].endMeter)}return 0}
function suggestedStart(k){const p=previousEnd(k);return p?p+Number(emp().arrivalAddKm||0):''}
function meterOptions(selectId,center){const sel=$(selectId);const current=Number(center)||0;sel.innerHTML='';const from=Math.max(0,current-100),to=current+100;for(let i=from;i<=to;i++){const o=document.createElement('option');o.value=i;o.textContent=fmt(i)+' km';sel.appendChild(o)}sel.value=String(current)}
function syncDistance(){const s=Number($('#startMeter').value)||0,en=Number($('#endMeter').value)||0;const d=s&&en&&en>=s?en-s:0;$('#distanceDisplay').value=fmt(d)+' km'}
function setStartMeter(v,rebuild=true){v=Math.max(0,Math.round(Number(v)||0));$('#startMeter').value=v||'';if(rebuild)meterOptions('#startMeterWheel',v);else $('#startMeterWheel').value=String(v);syncDistance()}
function setEndMeter(v,rebuild=true){v=Math.max(0,Math.round(Number(v)||0));$('#endMeter').value=v||'';if(rebuild)meterOptions('#endMeterWheel',v);else $('#endMeterWheel').value=String(v);syncDistance()}
function predictedEnd(){const s=Number($('#startMeter').value)||0;return s?Math.round(s+selectedDistance()):0}
function openEntry(k=keyOf(new Date())){const e=emp().entries[k]||{};selectedCompanyIds=[...(e.companyIds||[])];$('#entryDateKey').value=k;$('#entryDate').value=k;const suggested=e.startMeter||suggestedStart(k)||0;setStartMeter(suggested);$('#startHint').textContent=previousEnd(k)?`前回帰社 ${fmt(previousEnd(k))}km ＋ ${emp().arrivalAddKm}km`:'前回記録なし';$('#destinations').value=e.destinations||'';$('#directFlag').checked=!!e.directFlag;$('#memo').value=e.memo||'';renderCompanyChips();const end=e.endMeter||predictedEnd()||suggested;setEndMeter(end);updateEndHint();$('#deleteEntry').style.visibility=emp().entries[k]?'visible':'hidden';$('#entryDialog').showModal()}
function selectedDistance(){return selectedCompanyIds.reduce((sum,id)=>sum+Number(emp().companies.find(c=>c.id===id)?.distance||0),0)}
function selectedNames(){return selectedCompanyIds.map(id=>emp().companies.find(c=>c.id===id)?.name).filter(Boolean)}
function updateEndHint(){const d=selectedDistance();$('#companyTotal').textContent=`選択会社の概算距離 ${fmt(d)}km`;$('#endHint').textContent=d?`到着時メーター＋概算 ${fmt(d)}km`:'会社を選ぶと予測値を表示します'}
function renderCompanyChips(){const box=$('#companyChips');box.innerHTML='';emp().companies.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chip'+(selectedCompanyIds.includes(c.id)?' selected':'');b.innerHTML=`${c.name}<small>概算 ${fmt(c.distance)}km</small>`;b.onclick=()=>{selectedCompanyIds=selectedCompanyIds.includes(c.id)?selectedCompanyIds.filter(x=>x!==c.id):[...selectedCompanyIds,c.id];renderCompanyChips();const free=$('#destinations').value.split('、').map(x=>x.trim()).filter(Boolean).filter(x=>!emp().companies.some(c=>c.name===x));$('#destinations').value=[...selectedNames(),...free].join('、');setEndMeter(predictedEnd());updateEndHint()};box.appendChild(b)});updateEndHint()}
$('#startMeterWheel').onchange=()=>{setStartMeter($('#startMeterWheel').value,false);setEndMeter(predictedEnd());updateEndHint()};
$('#endMeterWheel').onchange=()=>setEndMeter($('#endMeterWheel').value,false);
$('#startMeter').oninput=()=>{const v=Number($('#startMeter').value)||0;meterOptions('#startMeterWheel',v);setEndMeter(predictedEnd());updateEndHint()};
$('#endMeter').oninput=()=>{const v=Number($('#endMeter').value)||0;meterOptions('#endMeterWheel',v);syncDistance()};
$('#entryForm').onsubmit=e=>{e.preventDefault();const k=$('#entryDate').value,old=$('#entryDateKey').value;if(old!==k)delete emp().entries[old];emp().entries[k]={startMeter:Number($('#startMeter').value)||'',endMeter:Number($('#endMeter').value)||'',companyIds:[...selectedCompanyIds],destinations:$('#destinations').value.trim(),directFlag:$('#directFlag').checked,memo:$('#memo').value.trim()};save();$('#entryDialog').close();render()};$('#deleteEntry').onclick=()=>{const k=$('#entryDateKey').value;if(confirm('この日の記録を削除しますか？')){delete emp().entries[k];save();$('#entryDialog').close();render()}};
function openProfile(){const e=emp();$('#personName').value=e.name;$('#oneWayKm').value=e.oneWayKm;$('#arrivalAddKm').value=e.arrivalAddKm;$('#directOneWayKm').value=e.directOneWayKm;renderCompanyRows();$('#profileDialog').showModal()}
function renderCompanyRows(){const box=$('#companyRows');box.innerHTML='';emp().companies.forEach(c=>{const r=document.createElement('div');r.className='companyrow';r.innerHTML=`<input value="${escapeHtml(c.name)}" data-company-name="${c.id}" placeholder="会社名"><input type="number" min="0" step="1" value="${c.distance}" data-company-distance="${c.id}" placeholder="km"><button type="button" data-remove-company="${c.id}">×</button>`;box.appendChild(r)});box.querySelectorAll('[data-remove-company]').forEach(b=>b.onclick=()=>{emp().companies=emp().companies.filter(c=>c.id!==b.dataset.removeCompany);renderCompanyRows()})}
$('#addCompanyBtn').onclick=()=>{emp().companies.push({id:'c'+Date.now(),name:'',distance:0});renderCompanyRows()};$('#profileForm').onsubmit=e=>{e.preventDefault();document.querySelectorAll('[data-company-name]').forEach(i=>{const c=emp().companies.find(x=>x.id===i.dataset.companyName);if(c)c.name=i.value.trim()});document.querySelectorAll('[data-company-distance]').forEach(i=>{const c=emp().companies.find(x=>x.id===i.dataset.companyDistance);if(c)c.distance=Number(i.value)||0});emp().companies=emp().companies.filter(c=>c.name);emp().name=$('#personName').value.trim()||'名称未設定';emp().oneWayKm=Number($('#oneWayKm').value)||0;emp().arrivalAddKm=Number($('#arrivalAddKm').value)||0;emp().directOneWayKm=Number($('#directOneWayKm').value)||0;save();$('#profileDialog').close();render()};
function renderEmployees(){const box=$('#employeeList');box.innerHTML='';Object.values(data.employees).forEach(e=>{const c=document.createElement('div');c.className='employee-card';c.innerHTML=`<div><b>${escapeHtml(e.name)}</b><small>会社 ${e.companies.length}件・記録 ${Object.keys(e.entries).length}日</small></div><button class="danger" data-del-employee="${e.id}" ${Object.keys(data.employees).length===1?'disabled':''}>削除</button>`;box.appendChild(c)});box.querySelectorAll('[data-del-employee]').forEach(b=>b.onclick=()=>{if(confirm('この従業員の設定と記録をすべて削除しますか？')){delete data.employees[b.dataset.delEmployee];data.activeEmployeeId=Object.keys(data.employees)[0];save();renderEmployees();render()}})}
$('#addEmployeeBtn').onclick=()=>{const name=prompt('従業員名を入力してください');if(!name)return;const id='e'+Date.now();data.employees[id]={id,name:name.trim(),oneWayKm:5,arrivalAddKm:10,directOneWayKm:7.5,companies:[],entries:{}};data.activeEmployeeId=id;save();$('#employeesDialog').close();render();openProfile()};
function buildReport(){const y=cursor.getFullYear(),m=cursor.getMonth(),n=daysInMonth(y,m),c=calc();let rows='';for(let d=1;d<=31;d++){const valid=d<=n,dt=new Date(y,m,d),k=keyOf(dt),e=valid?emp().entries[k]:null;rows+=`<tr><td class="c1">${d}</td><td class="c2">${valid?weekdays[dt.getDay()]:''}</td><td class="c3">${e?.directFlag?'○':''}</td><td class="c4 num">${e?.startMeter?fmt(e.startMeter)+' km':''}</td><td class="c5 num">${e?.endMeter?fmt(e.endMeter)+' km':''}</td><td class="c6 num">${fmt(entryDistance(e))} km</td><td>${escapeHtml(e?.destinations||'')}</td></tr>`}const era=y-2018;$('#printArea').innerHTML=`<div class="report"><div class="rtitle">令和${era}年${m+1}月分　車両管理月報</div><div class="rname">氏名：　${escapeHtml(emp().name)}</div><table><thead><tr><th class="c1">日付</th><th class="c2">曜日</th><th class="c3">直行<br>直帰</th><th class="c4">到着時メータ</th><th class="c5">帰社時メータ</th><th class="c6">走行距離</th><th>訪問先（所在地）</th></tr></thead><tbody>${rows}<tr class="total1"><td colspan="5" style="text-align:center">計</td><td class="num">${fmt(c.business)} km</td><td>←業務走行距離</td></tr><tr class="total2"><td colspan="5">（片道：${emp().oneWayKm}）km × 2 ×（出勤日数：${c.workdays}）日</td><td class="num">${fmt(c.commute)} km</td><td></td></tr><tr class="total2"><td colspan="5">（片道：${emp().directOneWayKm}）km ×（直行直帰回数：${c.directCount}）回</td><td class="num">${fmt(c.direct)} km</td><td>←直行直帰</td></tr><tr class="total3"><td colspan="5" style="text-align:center">総走行距離</td><td class="num">${fmt(c.total)} km</td><td class="no-border"></td></tr></tbody></table><div class="report-footer">当月精算ガソリン代：　　　　　　　　　円</div></div>`}
function exportExcel(){const y=cursor.getFullYear(),m=cursor.getMonth(),n=daysInMonth(y,m),c=calc(),rows=[];for(let d=1;d<=n;d++){const dt=new Date(y,m,d),e=emp().entries[keyOf(dt)]||{};rows.push([d,weekdays[dt.getDay()],e.directFlag?'○':'',e.startMeter||'',e.endMeter||'',entryDistance(e),e.destinations||''])}const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const rowXml=rows.map(r=>'<Row>'+r.map((v,i)=>`<Cell><Data ss:Type="${[0,3,4,5].includes(i)&&v!==''?'Number':'String'}">${esc(v)}</Data></Cell>`).join('')+'</Row>').join('');const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="${y}年${m+1}月"><Table><Row><Cell ss:MergeAcross="6"><Data ss:Type="String">${y}年${m+1}月 車両管理月報　${esc(emp().name)}</Data></Cell></Row><Row>${['日付','曜日','直行直帰','到着時メーター','帰社時メーター','走行距離','訪問先'].map(x=>`<Cell><Data ss:Type="String">${x}</Data></Cell>`).join('')}</Row>${rowXml}<Row><Cell ss:MergeAcross="4"><Data ss:Type="String">業務走行距離</Data></Cell><Cell><Data ss:Type="Number">${c.business}</Data></Cell></Row><Row><Cell ss:MergeAcross="4"><Data ss:Type="String">通勤距離</Data></Cell><Cell><Data ss:Type="Number">${c.commute}</Data></Cell></Row><Row><Cell ss:MergeAcross="4"><Data ss:Type="String">総走行距離</Data></Cell><Cell><Data ss:Type="Number">${c.total}</Data></Cell></Row></Table></Worksheet></Workbook>`;download(new Blob([xml],{type:'application/vnd.ms-excel'}),`車両管理月報_${emp().name}_${y}-${String(m+1).padStart(2,'0')}.xls`)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('#employeeSelect').onchange=e=>{data.activeEmployeeId=e.target.value;save();render()};$('#employeesBtn').onclick=()=>{renderEmployees();$('#employeesDialog').showModal()};$('#profileBtn').onclick=openProfile;$('#addBtn').onclick=()=>openEntry();$('#prevMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('#nextMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};$('#printBtn').onclick=()=>{buildReport();setTimeout(()=>window.print(),80)};$('#excelBtn').onclick=exportExcel;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
$('#backupBtn').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`車両管理バックアップ_${new Date().toISOString().slice(0,10)}.json`);$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.employees)throw 0;data=obj;save();alert('復元しました');$('#profileDialog').close();render()}catch{alert('読み込めませんでした')}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});save();render();
</script></body></html>
